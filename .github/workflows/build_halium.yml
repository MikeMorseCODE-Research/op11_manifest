name: Build halium_salami

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (userdebug or eng)'
        required: false
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - eng
      sync_flags:
        description: 'Extra repo sync flags (e.g. --force-sync)'
        required: false
        default: ''
  push:
    branches:
      - droidian
    paths:
      - 'salami-droidian.xml'
      - 'local_manifests/**'

concurrency:
  group: build-halium-salami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build halium_salami-${{ github.event.inputs.build_type || 'userdebug' }}
    runs-on: self-hosted
    timeout-minutes: 480

    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'userdebug' }}
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      CCACHE_SIZE: 50G
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 5
      USE_CCACHE: 1

    steps:
      - name: Check host resources
        run: |
          echo "=== Disk ==="
          df -h
          echo "=== RAM ==="
          free -h
          echo "=== CPUs ==="
          nproc
          echo "=== OS ==="
          lsb_release -a || cat /etc/os-release

          # Lowered to 225G to accommodate 238G actual binary usable space
          AVAIL=$(df --output=avail -BG "$GITHUB_WORKSPACE/.." | tail -1 | tr -d 'G')
          if [ "$AVAIL" -lt 225 ]; then
            echo "ERROR: Only ${AVAIL}G free — need at least 225G"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libwxgtk3.2-dev libxml2 libxml2-utils \
            lzop pngcrush python3 python3-pip python3-setuptools \
            rsync schedtool squashfs-tools unzip xsltproc zip zlib1g-dev
          
          if ! command -v repo &>/dev/null; then
            mkdir -p ~/.local/bin
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/.local/bin/repo
            chmod +x ~/.local/bin/repo
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config --global user.email "build-bot@halium-salami"
          git config --global user.name "Halium Build Bot"
          git config --global color.ui false
          git config --global init.defaultBranch main

      - name: Prepare source tree
        run: |
          SRC="$GITHUB_WORKSPACE/../halium-src"
          mkdir -p "$SRC"
          echo "SRC_DIR=$SRC" >> "$GITHUB_ENV"

      - name: repo init
        working-directory: ${{ env.SRC_DIR }}
        run: |
          repo init \
            -u https://github.com/Halium/android \
            -b halium-12.0 \
            --depth=1 \
            --no-repo-verify

      - name: Inject local manifest
        working-directory: ${{ env.SRC_DIR }}
        run: |
          mkdir -p .repo/local_manifests
          curl -fsSL \
            "https://raw.githubusercontent.com/MikeMorseCODE/op11_manifest/droidian/local_manifests/salami-droidian-override.xml" \
            -o .repo/local_manifests/salami-droidian-override.xml

      - name: repo sync
        working-directory: ${{ env.SRC_DIR }}
        run: |
          EXTRA="${{ github.event.inputs.sync_flags }}"
          repo sync \
            -c \
            -j$(nproc) \
            --no-tags \
            --no-clone-bundle \
            --optimized-fetch \
            --prune
