name: Build halium_salami kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Kernel variant'
        required: false
        default: 'gki'
        type: choice
        options:
          - gki
          - consolidate
  push:
    branches:
      - droidian
    paths:
      - 'local_manifests/**'

concurrency:
  group: kernel-salami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: kalama-${{ github.event.inputs.variant || 'gki' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      VARIANT: ${{ github.event.inputs.variant || 'gki' }}
      CLANG_VERSION: r450784e
      KDIR: ${{ github.workspace }}/msm-kernel
      OUT:  ${{ github.workspace }}/out

    steps:
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/share/miniconda \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          echo "After:"; df -h /

      - name: Install build dependencies + Clang 14
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential binutils-aarch64-linux-gnu \
            ccache cpio curl flex git kmod libelf-dev libssl-dev \
            python3 python3-pyelftools rsync schedtool unzip zip \
            clang-14 lld-14 llvm-14 clang-format-14

      - name: Configure git
        run: |
          git config --global user.email "build-bot@halium-salami"
          git config --global user.name "Halium Build Bot"

      - name: Wire Clang 14 into prebuilts path
        run: |
          CLANG_BIN="$HOME/clang-${CLANG_VERSION}/bin"
          mkdir -p "$CLANG_BIN"
          for f in /usr/lib/llvm-14/bin/*; do
            ln -sf "$f" "$CLANG_BIN/$(basename "$f")"
          done
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "=== sanity check ==="
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-strip; do
            echo -n "$t: "; "$CLANG_BIN/$t" --version 2>&1 | head -1
          done

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b droidian \
            https://github.com/MikeMorseCODE/kernel_oneplus_sm8550 \
            "$KDIR"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-kalama-${{ env.VARIANT }}-${{ github.sha }}
          restore-keys: |
            ccache-kalama-${{ env.VARIANT }}-
            ccache-kalama-

      - name: Set up ccache
        run: |
          ccache -M 8G
          ccache -z

      - name: Build kernel
        run: |
          set -o pipefail
          mkdir -p "$OUT"

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export PATH="$CLANG_BIN:$PATH"
          export CCACHE_DIR=~/.cache/ccache
          export CC="ccache clang"
          export HOSTCC="ccache clang"
          export HOSTCXX="ccache clang++"

          cd "$KDIR"

          echo "--- applying defconfig ---"
          make O="$OUT" -j$(nproc) gki_defconfig

          echo "--- merging config fragments ---"
          for frag in \
            arch/arm64/configs/vendor/kalama_GKI.config \
            arch/arm64/configs/vendor/oplus/kalama_GKI.config \
            arch/arm64/configs/vendor/debugfs.config \
            arch/arm64/configs/vendor/droidian.config; do
            if [ -f "$frag" ]; then
              echo "  applying $frag"
              scripts/kconfig/merge_config.sh -m \
                -O "$OUT" "$OUT/.config" "$frag"
            fi
          done

          echo "--- olddefconfig ---"
          make O="$OUT" -j$(nproc) olddefconfig

          echo "--- build ---"
          make O="$OUT" -j$(nproc) Image modules \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          echo "--- dtbs ---"
          make O="$OUT" -j$(nproc) dtbs 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Collect artifacts
        if: success()
        run: |
          DEST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DEST"

          # Kernel image
          cp "$OUT/arch/arm64/boot/Image" "$DEST/" && echo "  Image"

          # All DTBs
          find "$OUT/arch/arm64/boot/dts" -name '*.dtb' -o -name '*.dtbo' | \
            tar -czf "$DEST/dtbs.tar.gz" -T - && echo "  dtbs.tar.gz"

          # All modules
          find "$OUT" -name '*.ko' | \
            tar -czf "$DEST/modules.tar.gz" -T - && echo "  modules.tar.gz"

          ls -lh "$DEST"/

      - name: Upload kernel artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalama-${{ env.VARIANT }}-${{ github.run_number }}
          path: dist/
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      - name: ccache stats
        if: always()
        run: ccache -s
