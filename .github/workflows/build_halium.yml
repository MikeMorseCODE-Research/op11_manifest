name: Build halium_salami kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Kernel variant'
        required: false
        default: 'gki'
        type: choice
        options:
          - gki
          - consolidate
  push:
    branches:
      - droidian
    paths:
      - 'local_manifests/**'

concurrency:
  group: kernel-salami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: kalama-${{ github.event.inputs.variant || 'gki' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      VARIANT: ${{ github.event.inputs.variant || 'gki' }}
      KDIR: ${{ github.workspace }}/msm-kernel
      OUT:  ${{ github.workspace }}/out

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          df -h

      - name: Install build dependencies + Clang 14
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang-14 lld-14 llvm-14 clang-format-14 \
            bc bison build-essential binutils-aarch64-linux-gnu \
            cpio flex git libelf-dev libssl-dev libncurses-dev \
            python3 rsync wget zip ccache

      - name: Wire Clang 14 into prebuilts path
        run: |
          CLANG_BIN="$HOME/clang-r450784e/bin"
          mkdir -p "$CLANG_BIN"
          for f in /usr/lib/llvm-14/bin/*; do
            ln -sf "$f" "$CLANG_BIN/$(basename "$f")"
          done
          for f in /usr/bin/aarch64-linux-gnu-*; do
            ln -sf "$f" "$CLANG_BIN/$(basename "$f")"
          done
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          "$CLANG_BIN/clang" --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b droidian \
            https://github.com/MikeMorseCODE/kernel_oneplus_sm8550 "$KDIR"

      - name: Fix dangling OPlus symlinks
        run: |
          cd "$KDIR"
          # Use find -L -type l which reliably catches dangling symlinks
          find -L . -type l 2>/dev/null | while IFS= read -r link; do
            target="$(readlink "$link")"
            rm -f "$link"
            mkdir -p "$link"
            printf '# stub — missing OPlus source: %s\n' "$target" \
              > "$link/Kconfig"
            touch "$link/Makefile"
          done
          remaining=$(find -L . -type l 2>/dev/null | wc -l)
          echo "Dangling symlinks remaining: $remaining"
          # Verify the boot symlink was stubbed
          ls -la include/soc/oplus/ || true

      - name: Stub missing OPlus headers (Python scan)
        run: |
          python3 << 'PYEOF'
          import os, re

          kdir = os.environ['KDIR']

          ifdef_oplus   = re.compile(r'#\s*ifdef\s+OPLUS_ARCH_EXTENDS')
          ifdef_generic = re.compile(r'#\s*if(?:def|ndef)\s+\w+')
          endif_re      = re.compile(r'#\s*endif')
          rel_inc_re    = re.compile(r'#\s*include\s+"([^"]+)"')
          abs_inc_re    = re.compile(r'#\s*include\s+<([^>]*oplus[^>]*)>', re.IGNORECASE)

          stubs = []

          def ensure_stub(path):
              if not os.path.lexists(path):
                  try:
                      os.makedirs(os.path.dirname(path), exist_ok=True)
                      open(path, 'w').close()
                      stubs.append(path)
                  except Exception as e:
                      print(f"  WARN could not create {path}: {e}")

          for root, dirs, files in os.walk(kdir):
              dirs[:] = [d for d in dirs if d not in ('out', '.git')]
              for fname in files:
                  if not fname.endswith(('.c', '.h', '.cpp')):
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      lines = open(fpath, encoding='utf-8', errors='replace').readlines()
                  except Exception:
                      continue

                  depth = 0
                  oplus_depth = None

                  for line in lines:
                      s = line.strip()

                      if ifdef_oplus.search(s):
                          depth += 1
                          if oplus_depth is None:
                              oplus_depth = depth
                      elif ifdef_generic.search(s):
                          depth += 1
                      elif endif_re.search(s):
                          if oplus_depth is not None and depth == oplus_depth:
                              oplus_depth = None
                          depth = max(depth - 1, 0)

                      # Relative includes inside OPLUS_ARCH_EXTENDS
                      if oplus_depth is not None:
                          m = rel_inc_re.search(s)
                          if m:
                              inc_abs = os.path.normpath(
                                  os.path.join(os.path.dirname(fpath), m.group(1))
                              )
                              ensure_stub(inc_abs)

                      # Angle-bracket oplus includes anywhere in tree
                      m = abs_inc_re.search(s)
                      if m:
                          inc_path = m.group(1)
                          for base in (os.path.join(kdir, 'include'), kdir):
                              ensure_stub(os.path.join(base, inc_path))

          print(f"Stub headers created: {len(stubs)}")
          for s in sorted(stubs):
              print(f"  {s}")
          PYEOF

      - name: Patch known OPlus forwarding-header stubs
        run: |
          # include/soc/oplus/system/*.h are real files that forward-include into
          # include/soc/oplus/boot/ (a dangling symlink, now stub dir). Create
          # proper stub targets with enough type definitions to compile.

          BOOT="$KDIR/include/soc/oplus/boot"
          mkdir -p "$BOOT"

          cat > "$BOOT/boot_mode.h" << 'EOF'
          /* Auto-generated stub: missing OPlus vendor source */
          #ifndef __OPLUS_BOOT_MODE_H__
          #define __OPLUS_BOOT_MODE_H__
          enum MSM_BOOT_TYPE {
              MSM_BOOT_MODE__NORMAL   = 0,
              MSM_BOOT_MODE__FASTBOOT = 1,
              MSM_BOOT_MODE__RECOVERY = 2,
              MSM_BOOT_MODE__CHARGE   = 3,
              MSM_BOOT_MODE__FACTORY2 = 4,
              MSM_BOOT_MODE__RF       = 5,
              MSM_BOOT_MODE__WLAN     = 6,
              MSM_BOOT_MODE__MOS      = 7,
              MSM_BOOT_MODE__AGING    = 8,
              MSM_BOOT_MODE__SILENCE  = 9,
              MSM_BOOT_MODE__SAU      = 10,
              MSM_BOOT_MODE__SAE      = 11,
              BOOT_MODE_MAX,
          };
          extern unsigned int get_boot_mode(void);
          #endif /* __OPLUS_BOOT_MODE_H__ */
          EOF

          # Minimal stub for oplus_project.h
          cat > "$BOOT/oplus_project.h" << 'EOF'
          /* Auto-generated stub: missing OPlus vendor source */
          #ifndef __OPLUS_PROJECT_H__
          #define __OPLUS_PROJECT_H__
          static inline unsigned int get_project(void) { return 0; }
          static inline unsigned int get_PCB_Version(void) { return 0; }
          static inline unsigned int get_Modem_Version(void) { return 0; }
          #endif /* __OPLUS_PROJECT_H__ */
          EOF

          # Catch-all: any other headers that land in this boot dir
          for f in "$BOOT"/*.h; do
            [ -e "$f" ] || true  # glob may not match anything
          done

          echo "Boot stubs written:"
          ls -la "$BOOT/"

          # Also ensure device_info.h forwarding stub exists in include path
          touch "$KDIR/include/soc/oplus/device_info.h"

          # Stub out dfr/dft dirs which are also dangling symlinks under include/soc/oplus
          for d in dfr dft; do
            mkdir -p "$KDIR/include/soc/oplus/$d"
            touch "$KDIR/include/soc/oplus/$d/oplus_${d}.h" 2>/dev/null || true
          done

      - name: Patch oplus_audio_switch stub with needed declarations
        run: |
          STUB_CONTENT='/* Auto-generated stub: missing OPlus vendor source */
          #pragma once
          #include <linux/notifier.h>
          static inline int register_chg_glink_notifier(struct notifier_block *nb)
          { (void)nb; return 0; }
          static inline int unregister_chg_glink_notifier(struct notifier_block *nb)
          { (void)nb; return 0; }'

          found=0
          while IFS= read -r f; do
            printf '%s\n' "$STUB_CONTENT" > "$f"
            echo "Patched: $f"
            found=1
          done < <(find "$KDIR" -path "*/power/oplus/v2/include/oplus_audio_switch.h" 2>/dev/null)

          if [ "$found" -eq 0 ]; then
            for dir in \
              "$KDIR/drivers/power/oplus/v2/include" \
              "$KDIR/power/oplus/v2/include"; do
              mkdir -p "$dir"
              printf '%s\n' "$STUB_CONTENT" > "$dir/oplus_audio_switch.h"
              echo "Created: $dir/oplus_audio_switch.h"
            done
          fi

      - name: Generate OPlus config disable fragment
        run: |
          python3 << 'PYEOF'
          import os, re

          kdir = os.environ['KDIR']

          obj_re = re.compile(
              r'obj-\$\((CONFIG_[A-Z0-9_]+)\)\s*\+=[^\n]*oplus',
              re.IGNORECASE
          )

          configs = set()

          for root, dirs, files in os.walk(kdir):
              dirs[:] = [d for d in dirs if d not in ('out', '.git')]
              for fname in files:
                  if fname != 'Makefile':
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      content = open(fpath, encoding='utf-8', errors='replace').read()
                  except Exception:
                      continue
                  for m in obj_re.finditer(content):
                      configs.add(m.group(1))

          configs.add('CONFIG_FSA4480_I2C')

          frag = os.path.join(kdir, 'arch/arm64/configs/vendor/oplus_stub_disable.config')
          os.makedirs(os.path.dirname(frag), exist_ok=True)
          with open(frag, 'w') as f:
              for cfg in sorted(configs):
                  f.write(f'# {cfg} is not set\n')

          print(f"Wrote {len(configs)} disables to {frag}")
          for c in sorted(configs):
              print(f"  # {c} is not set")
          PYEOF

      - name: Configure kernel
        run: |
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export PATH="$CLANG_BIN:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          cd "$KDIR"
          mkdir -p "$OUT"
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) gki_defconfig
          for frag in \
            arch/arm64/configs/vendor/kalama_GKI.config \
            arch/arm64/configs/vendor/oplus/kalama_GKI.config \
            arch/arm64/configs/vendor/debugfs.config \
            arch/arm64/configs/vendor/droidian.config \
            arch/arm64/configs/vendor/oplus_stub_disable.config; do
            if [ -f "$frag" ]; then
              echo "Merging fragment: $frag"
              ./scripts/kconfig/merge_config.sh -m -O "$OUT" \
                "$OUT/.config" "$frag"
            fi
          done
          make O="$OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) olddefconfig

      - name: Build kernel
        run: |
          export ARCH=arm64 LLVM=1 LLVM_IAS=1
          export PATH="$CLANG_BIN:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 8G
          cd "$KDIR"
          make O="$OUT" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            -j$(nproc) Image modules dtbs \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Package artifacts
        run: |
          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"
          cp "$OUT/arch/arm64/boot/Image" "$DIST/"
          make -C "$KDIR" O="$OUT" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$DIST/modules_root" \
            modules_install
          tar -czf "$DIST/modules.tar.gz" -C "$DIST/modules_root" .
          find "$OUT/arch/arm64/boot/dts" -name "*.dtb" \
            -exec cp {} "$DIST/" \;
          ls -lh "$DIST/"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ github.workspace }}/build.log
          retention-days: 7

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kalama-kernel-${{ github.event.inputs.variant || 'gki' }}-${{ github.run_number }}
          path: ${{ github.workspace }}/dist/
          retention-days: 30
