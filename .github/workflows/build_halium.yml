name: Build halium_salami kernel

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Kernel variant'
        required: false
        default: 'gki'
        type: choice
        options:
          - gki
          - consolidate
  push:
    branches:
      - droidian
    paths:
      - 'local_manifests/**'

concurrency:
  group: kernel-salami-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: kalama-${{ github.event.inputs.variant || 'gki' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      VARIANT: ${{ github.event.inputs.variant || 'gki' }}
      ROOT_DIR: ${{ github.workspace }}/kws
      KERNEL_DIR: msm-kernel
      CLANG_VERSION: r450784e

    steps:
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL \
            /opt/az \
            /usr/share/miniconda \
            "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -af 2>/dev/null || true
          echo "After:"; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git \
            kmod libelf-dev libssl-dev python3 rsync schedtool \
            unzip zip

      - name: Configure git
        run: |
          git config --global user.email "build-bot@halium-salami"
          git config --global user.name "Halium Build Bot"

      - name: Create workspace
        run: mkdir -p "$ROOT_DIR"

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b droidian \
            https://github.com/MikeMorseCODE/kernel_oneplus_sm8550 \
            "$ROOT_DIR/msm-kernel"

      - name: Clone kernel modules
        run: |
          git clone --depth=1 -b droidian \
            https://github.com/MikeMorseCODE/android_kernel_oneplus_sm8550-modules \
            "$ROOT_DIR/kernel/oneplus/sm8550-modules"

      - name: Clone devicetrees
        run: |
          git clone --depth=1 -b droidian \
            https://github.com/MikeMorseCODE/android_kernel_oneplus_sm8550-devicetrees \
            "$ROOT_DIR/kernel/oneplus/sm8550-devicetrees"

      - name: Clone Android kernel build scripts
        run: |
          git clone --depth=1 \
            https://android.googlesource.com/kernel/build \
            "$ROOT_DIR/kernel/build"
          ln -s "$ROOT_DIR/kernel/build" "$ROOT_DIR/build"

      - name: Cache Clang ${{ env.CLANG_VERSION }}
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ROOT_DIR }}/prebuilts/clang/host/linux-x86/clang-${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}-v1

      - name: Download Clang ${{ env.CLANG_VERSION }}
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          DEST="$ROOT_DIR/prebuilts/clang/host/linux-x86"
          mkdir -p "$DEST"
          cd "$DEST"
          git init
          git remote add origin \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
          git sparse-checkout init --cone
          git sparse-checkout set "clang-${CLANG_VERSION}"
          git pull --depth=1 origin master
          echo "Clang bin contents:"
          ls "clang-${CLANG_VERSION}/bin/" | head -20

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-kalama-${{ env.VARIANT }}-${{ github.sha }}
          restore-keys: |
            ccache-kalama-${{ env.VARIANT }}-
            ccache-kalama-

      - name: Set up ccache
        run: |
          ccache -M 8G
          ccache -z

      - name: Build kernel
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          set -o pipefail
          export CCACHE_DIR=~/.cache/ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export LTO=thin
          VARIANT="$VARIANT" \
          BUILD_CONFIG=msm-kernel/build.config.msm.kalama \
          EXT_MODULES="\
            kernel/oneplus/sm8550-modules/qcom/opensource/audio-kernel \
            kernel/oneplus/sm8550-modules/qcom/opensource/camera-kernel \
            kernel/oneplus/sm8550-modules/qcom/opensource/display-drivers/msm \
            kernel/oneplus/sm8550-modules/qcom/opensource/graphics-kernel \
            kernel/oneplus/sm8550-modules/qcom/opensource/wlan/qcacld-3.0/.kiwi_v2 \
            kernel/oneplus/sm8550-modules/qcom/opensource/bt-kernel" \
          build/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect output images
        if: success()
        run: |
          DIST="$ROOT_DIR/out/msm-kernel/dist"
          DEST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DEST"
          for f in boot.img vendor_boot.img dtbo.img Image Image.gz vendor_dlkm.img; do
            [ -f "$DIST/$f" ] && cp "$DIST/$f" "$DEST/" && echo "  $f"
          done
          find "$DIST" -name '*.ko' | tar -czf "$DEST/modules.tar.gz" -T - 2>/dev/null || true
          ls -lh "$DEST"/

      - name: Upload kernel images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kalama-${{ env.VARIANT }}-${{ github.run_number }}
          path: dist/
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          retention-days: 7

      - name: ccache stats
        if: always()
        run: ccache -s
